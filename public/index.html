<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2eee5">
    <title>opsek.pl</title>
    <style>
      :root {
        color-scheme: light;
        background: #f2eee5;
        color: #191914;
        font-family: system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        background: #f2eee5;
      }

      main {
        display: grid;
        min-height: 100svh;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1.25rem, 4vw, 3.5rem);
      }

      .wordmark {
        width: fit-content;
        color: inherit;
        font-size: 1rem;
        font-weight: 750;
        letter-spacing: -0.04em;
        text-decoration: none;
      }

      .hero {
        align-self: center;
        width: min(100%, 64rem);
        margin: 8vh auto 12vh;
      }

      h1 {
        max-width: 12ch;
        margin: 0 0 clamp(2rem, 6vw, 4.5rem);
        font-size: clamp(3.5rem, 12vw, 10rem);
        font-weight: 580;
        letter-spacing: -0.085em;
        line-height: 0.9;
      }

      button {
        min-height: 3.25rem;
        padding: 0.85rem 1.2rem;
        border: 0;
        border-radius: 0.25rem;
        background: #b34427;
        color: #fffaf4;
        font: 650 1rem/1 system-ui, sans-serif;
        cursor: pointer;
      }

      button:hover { background: #91351f; }

      button:focus-visible {
        outline: 3px solid #191914;
        outline-offset: 4px;
      }

      .film-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #080808;
      }

      .film-screen[hidden] { display: none; }

      video {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        object-fit: contain;
      }

      .retry {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
      }

      .retry[hidden] { display: none; }

      @media (max-width: 600px) {
        .hero { margin-block: 12vh; }
        h1 { max-width: 9ch; }
      }
    </style>
  </head>
  <body>
    <main id="home">
      <a class="wordmark" href="/" aria-label="opsek.pl — strona główna">opsek.pl</a>
      <section class="hero" aria-labelledby="headline">
        <h1 id="headline">Zobacz, co jest dalej.</h1>
        <button id="learn-more" type="button">Dowiedz się więcej</button>
      </section>
    </main>
    <section id="film-screen" class="film-screen" aria-label="Wideo opsek.pl" hidden>
      <video id="film" playsinline controls preload="none" aria-label="Wideo opsek.pl">
        <source src="/film.mp4" type="video/mp4">
        Twoja przeglądarka nie obsługuje odtwarzania wideo.
      </video>
      <button id="retry" class="retry" type="button" hidden>Odtwórz wideo z dźwiękiem</button>
    </section>
    <script>
      const home = document.querySelector('#home');
      const filmScreen = document.querySelector('#film-screen');
      const film = document.querySelector('#film');
      const learnMore = document.querySelector('#learn-more');
      const retry = document.querySelector('#retry');

      learnMore.addEventListener('click', () => {
        home.hidden = true;
        filmScreen.hidden = false;
        film.play().then(() => {
          retry.hidden = true;
        }).catch(() => {
          retry.hidden = false;
        });
      });

      retry.addEventListener('click', () => {
        film.play().then(() => {
          retry.hidden = true;
        }).catch(() => {
          retry.hidden = false;
        });
      });
    </script>
  </body>
</html>
