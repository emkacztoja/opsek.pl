<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090a">
    <meta name="description" content="OPSEK builds practical software products for automation and infrastructure.">
    <title>OPSEK — Practical software products</title>
    <style>
      :root {
        color-scheme: dark;
        background: #08090a;
        color: #eeefeb;
        font-family: Inter, Geist, ui-sans-serif, system-ui, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --surface: #08090a;
        --text: #eeefeb;
        --muted: #a2a6a3;
        --line: #292c2d;
        --accent: #ff754d;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; margin: 0; }

      body {
        min-height: 100svh;
        background: var(--surface);
      }

      button { font: inherit; }

      .site-shell {
        position: relative;
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        isolation: isolate;
        overflow: hidden;
        padding: clamp(1.25rem, 4.2vw, 4rem);
      }

      .site-shell::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background-image: linear-gradient(#17191a 1px, transparent 1px), linear-gradient(90deg, #17191a 1px, transparent 1px);
        background-position: center;
        background-size: 72px 72px;
        content: "";
        opacity: 0.32;
        mask-image: radial-gradient(ellipse at 54% 43%, #000 0%, transparent 72%);
      }

      .topbar, .bottom-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .topbar { min-height: 2.4rem; }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 760;
        letter-spacing: 0.11em;
        text-decoration: none;
      }

      .brand-mark { width: 1.35rem; height: 1.35rem; color: var(--accent); }

      .top-note, .eyebrow, .bottom-label, .product-name {
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .top-note { color: var(--muted); }

      .hero {
        width: min(100%, 76rem);
        margin: auto;
        padding: clamp(5rem, 14vh, 10rem) 0 clamp(4rem, 11vh, 8rem);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1.8rem;
        color: var(--accent);
      }

      .eyebrow::before {
        width: 1.6rem;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(3.4rem, 10.5vw, 9.4rem);
        font-weight: 560;
        letter-spacing: -0.078em;
        line-height: 0.91;
      }

      h1 span { color: #858a88; }

      .hero-bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 2.5rem;
        margin-top: clamp(2.5rem, 6vw, 4.5rem);
      }

      .intro {
        max-width: 33rem;
        margin: 0;
        color: #c2c5c1;
        font-size: clamp(1rem, 1.6vw, 1.25rem);
        line-height: 1.65;
      }

      .cta {
        display: inline-flex;
        min-height: 3.35rem;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        padding: 0.9rem 1.15rem;
        border: 1px solid var(--accent);
        border-radius: 0.2rem;
        background: var(--accent);
        color: #10100f;
        font-size: 0.92rem;
        font-weight: 680;
        cursor: pointer;
        transition: background-color 140ms ease, color 140ms ease;
      }

      .cta:hover { background: #ff8b69; border-color: #ff8b69; }

      .cta-arrow {
        font-size: 1.15rem;
        font-weight: 450;
        line-height: 1;
        transition: transform 140ms ease;
      }

      .cta:hover .cta-arrow { transform: translateX(3px); }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .bottom-bar {
        min-height: 4.2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
      }

      .focus-list, .product-list {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.7rem 1.35rem;
      }

      .bottom-label { margin-right: 0.25rem; color: #777d7a; }
      .focus-item { color: #c2c5c1; font-size: 0.78rem; }
      .product-name { color: #c2c5c1; letter-spacing: 0.045em; }
      .product-name b { color: var(--text); font-weight: 700; }

      .film-screen {
        position: fixed;
        z-index: 5;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #050505;
      }

      .film-screen[hidden] { display: none; }

      video {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        object-fit: contain;
      }

      .film-actions {
        position: fixed;
        z-index: 6;
        top: clamp(1rem, 3vw, 2rem);
        right: clamp(1rem, 3vw, 2rem);
        display: flex;
        gap: 0.65rem;
      }

      .film-actions button {
        min-height: 2.65rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid #494c4c;
        border-radius: 0.2rem;
        background: #111313;
        color: var(--text);
        cursor: pointer;
      }

      .film-actions button:hover { border-color: var(--accent); }

      .retry {
        position: fixed;
        z-index: 7;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
      }

      .retry[hidden] { display: none; }

      @media (max-width: 680px) {
        .top-note { max-width: 10rem; text-align: right; line-height: 1.5; }
        .hero { padding-block: 6rem 4.5rem; }
        .hero-bottom { align-items: flex-start; flex-direction: column; gap: 1.5rem; }
        .bottom-bar { align-items: flex-start; flex-direction: column; padding-block: 1.2rem; }
        .focus-list, .product-list { gap: 0.6rem 1rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main id="home" class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="OPSEK — home">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 8h8v8H8z" stroke="currentColor" stroke-width="1.5" />
            <path d="M12 4v4m8 4h-4M12 20v-4M4 12h4" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>OPSEK</span>
        </a>
        <span class="top-note">Software / Systems / Automation</span>
      </header>

      <section class="hero" aria-labelledby="headline">
        <p class="eyebrow">Practical software products</p>
        <h1 id="headline">Hard problems.<br><span>Practical tools.</span></h1>
        <div class="hero-bottom">
          <p class="intro">OPSEK builds software for automation and infrastructure — tools that save time or money.</p>
          <button id="learn-more" class="cta" type="button">
            <span>Learn more</span>
            <span class="cta-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <footer class="bottom-bar">
        <div class="focus-list" aria-label="Focus areas">
          <span class="bottom-label">Focus</span>
          <span class="focus-item">Automation</span>
          <span class="focus-item">Infrastructure</span>
          <span class="focus-item">Software tools</span>
        </div>
        <div class="product-list" aria-label="OPSEK product lines">
          <span class="bottom-label">Product lines</span>
          <span class="product-name"><b>01</b> / Surface</span>
          <span class="product-name"><b>02</b> / Blackbox</span>
          <span class="product-name"><b>03</b> / DPP</span>
        </div>
      </footer>
    </main>

    <section id="film-screen" class="film-screen" aria-label="OPSEK video" hidden>
      <video id="film" playsinline controls preload="none" aria-label="OPSEK video">
        <source src="/film.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
      <div class="film-actions">
        <button id="return-home" type="button">← Back</button>
      </div>
      <button id="retry" class="cta retry" type="button" hidden>Play video with sound</button>
    </section>

    <script>
      const home = document.querySelector('#home');
      const filmScreen = document.querySelector('#film-screen');
      const film = document.querySelector('#film');
      const learnMore = document.querySelector('#learn-more');
      const returnHome = document.querySelector('#return-home');
      const retry = document.querySelector('#retry');

      learnMore.addEventListener('click', () => {
        home.hidden = true;
        filmScreen.hidden = false;
        film.play().then(() => {
          retry.hidden = true;
        }).catch(() => {
          retry.hidden = false;
        });
      });

      retry.addEventListener('click', () => {
        film.play().then(() => {
          retry.hidden = true;
        }).catch(() => {
          retry.hidden = false;
        });
      });

      returnHome.addEventListener('click', () => {
        film.pause();
        film.currentTime = 0;
        filmScreen.hidden = true;
        home.hidden = false;
        learnMore.focus();
      });
    </script>
  </body>
</html>
